name: Firefox CI

on:
  push:
    branches:
      - main
      - firefox-addon
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run analyzer tests
        run: npm test

      - name: Package add-on
        run: npm run package

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: acumatica-audit-trail-analyzer-firefox
          path: dist/*.zip
          if-no-files-found: error
