name: Firefox CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run analyzer tests
        run: npm test

      - name: Package add-on
        run: npm run package

      - name: Prepare packaged source for Firefox lint
        run: |
          ZIP="$(find dist -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf dist/lint-source
          mkdir -p dist/lint-source
          unzip -q "$ZIP" -d dist/lint-source

      - name: Lint Firefox package
        run: npx --yes web-ext@10 lint --source-dir dist/lint-source

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: acumatica-audit-trail-analyzer-firefox
          path: dist/*.zip
          if-no-files-found: error
