name: Sign Firefox add-on

on:
  workflow_dispatch:
  push:
    tags:
      - 'firefox-v*'

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run analyzer tests
        run: npm test

      - name: Package add-on
        run: npm run package

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/firefox-v')
        run: |
          EXPECTED="${GITHUB_REF_NAME#firefox-v}"
          ACTUAL="$(node -p "require('./manifest.json').version")"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Tag version $EXPECTED does not match manifest version $ACTUAL."
            exit 1
          fi

      - name: Prepare signing source
        run: |
          ZIP="$(find dist -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf dist/sign-source dist/signed
          mkdir -p dist/sign-source dist/signed
          unzip -q "$ZIP" -d dist/sign-source

      - name: Sign through Mozilla Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY" || { echo "Missing GitHub secret: AMO_JWT_ISSUER"; exit 1; }
          test -n "$WEB_EXT_API_SECRET" || { echo "Missing GitHub secret: AMO_JWT_SECRET"; exit 1; }
          npx --yes web-ext@10 sign \
            --source-dir dist/sign-source \
            --artifacts-dir dist/signed \
            --channel unlisted \
            --approval-timeout 900000

      - name: Normalize signed XPI name
        id: release_asset
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          XPI="$(find dist/signed -maxdepth 1 -type f -name '*.xpi' | head -n 1)"
          test -n "$XPI"
          OUT="dist/signed/acumatica-audit-trail-analyzer-firefox-v${VERSION}.xpi"
          if [ "$XPI" != "$OUT" ]; then
            mv "$XPI" "$OUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "xpi=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload signed XPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: acumatica-audit-trail-analyzer-firefox-signed
          path: ${{ steps.release_asset.outputs.xpi }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed XPI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/firefox-v')
        env:
          GH_TOKEN: ${{ github.token }}
          XPI: ${{ steps.release_asset.outputs.xpi }}
          VERSION: ${{ steps.release_asset.outputs.version }}
        run: |
          TAG="$GITHUB_REF_NAME"
          TITLE="Acumatica Audit Trail Analyzer Firefox v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XPI" --clobber
          else
            gh release create "$TAG" "$XPI" \
              --verify-tag \
              --title "$TITLE" \
              --generate-notes
          fi
