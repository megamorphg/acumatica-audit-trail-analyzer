<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acumatica Audit Trail Analyzer</title>
  <style>
    body {
      width: 268px;
      margin: 0;
      padding: 14px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1c2430;
      background: #fff;
    }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p.hint { margin: 0 0 12px; color: #62707f; font-size: 12px; }
    button {
      display: block;
      width: 100%;
      font: inherit;
      text-align: left;
      padding: 9px 12px;
      margin-bottom: 7px;
      border-radius: 7px;
      border: 1px solid #cfd8e2;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #eef3f8; }
    button.primary { background: #1c6ea4; border-color: #1c6ea4; color: #fff; }
    button.primary:hover { filter: brightness(1.08); }
    a { display: inline-block; margin-top: 6px; font-size: 12px; color: #1c6ea4; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a2029; color: #e7edf4; }
      p.hint { color: #a8b4c2; }
      button { background: #2a333f; border-color: #3a4553; color: #e7edf4; }
      button:hover { background: #333e4c; }
      a { color: #6cb6e8; }
    }
  </style>
</head>
<body>
  <h1>Audit Trail Analyzer</h1>
  <p class="hint">Open Acumatica's Audit History (SM205540) for a record, then:</p>

  <button id="analyze" class="primary">📖 Explain this history</button>
  <button id="copy">📋 Copy last summary</button>
  <button id="fab">📌 Show the floating button</button>

  <a href="#" id="options">⚙️ AI prompt &amp; display settings</a>

  <script src="popup.js"></script>
</body>
</html>
